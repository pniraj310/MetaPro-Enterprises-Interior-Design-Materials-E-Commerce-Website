server:
  port: ${PORT:8080}

spring:
  application:
    name: metapro-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/metapro_db}
      auto-index-creation: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000 # 24 hours
  admin:
    initial-user: ${ADMIN_INITIAL_USER:admin}
    initial-email: ${ADMIN_INITIAL_EMAIL:pdheeraj351@gmail.com}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}

logging:
  level:
    root: INFO
    com.metapro: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG
