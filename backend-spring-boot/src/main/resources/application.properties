# Server Configuration
server.port=8080
server.servlet.context-path=/

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://${SQL_HOST:localhost}:${SQL_PORT:5432}/${SQL_DB_NAME:metapro_db}
spring.datasource.username=${SQL_USER:postgres}
spring.datasource.password=${SQL_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ==================================================
# RAZORPAY ENVIRONMENT CREDENTIALS
# ==================================================
# Environment: 'test' or 'live'
razorpay.mode=${RAZORPAY_MODE:test}
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_YOUR_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:YOUR_KEY_SECRET_DO_NOT_EXPOSE}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:YOUR_WEBHOOK_SECRET}
razorpay.currency=INR
